<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邦国录</title>
    <style>
      /* Kimi 反审 #7e：字体放 public/fonts/ 而非 src/，避免 Vite 打包后 file:// 路径错位 */
      @font-face {
        font-family: 'Noto Serif SC';
        src: url('/fonts/NotoSerifSC-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Serif SC';
        src: url('/fonts/NotoSerifSC-Bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: url('/fonts/NotoSansSC-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1410;
        color: #c9a84c;
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 防止 Phaser canvas 被默认 inline-block 行高顶出 1px */
      #game-container canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
